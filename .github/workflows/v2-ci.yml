name: V2 staging foundation CI
on:
  push:
    branches: ['codex/v2-**']
  pull_request:
    branches: [main, 'codex/v2-**']
permissions:
  contents: read
concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: staging
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_EXPECTED_SUPABASE_REF: local
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      VITE_APP_ORIGIN: http://localhost:5173
      VITE_PAYMENT_ENV: sandbox
      VITE_ENABLE_TEST_PAYMENTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build staging only
        run: npm run build
      - name: Verify staging artifact and workflow boundaries
        run: npm run verify:staging
